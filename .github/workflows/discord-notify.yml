name: Discord Activity Notifications

on: # zizmor: ignore[dangerous-triggers] Every privileged event executes only the pinned default-branch script.
  push:
    # CI owns main push ordering; Dependabot pushes cannot read Actions secrets.
    branches-ignore:
      - main
      - 'dependabot/**'
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed
      - review_requested
  issues:
    types:
      - opened
      - reopened
      - closed
      - assigned
  issue_comment:
    types:
      - created
  pull_request_review:
    types:
      - submitted
  pull_request_review_comment:
    types:
      - created
  workflow_run:
    workflows:
      - CI
      - Release
      - Publish Distribution Metadata
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  notify:
    name: Send notification
    if: >-
      (!startsWith(github.event_name, 'pull_request_review') ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        contains(fromJSON('["push","workflow_dispatch","workflow_run","release"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout trusted notification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Privileged events must never execute pull request code or artifacts.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/discord-notify.mjs
